<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carômetro - Monitoramento de Alunos</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="8" fill="#ffffff20"/>
            <path d="M12 28V14a2 2 0 012-2h12a2 2 0 012 2v14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            <path d="M8 28h24" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            <circle cx="20" cy="19" r="4" stroke="#fff" stroke-width="2"/>
            <path d="M16 26c0-2.2 1.8-4 4-4s4 1.8 4 4" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>Carômetro</h1>
          <p>Monitoramento de Alunos</p>
        </div>
      </div>
      <div class="header-stats" id="headerStats">
        <!-- Preenchido via JS -->
      </div>
    </div>
  </header>

  <!-- ========== CONTROLES / FILTROS ========== -->
  <section class="controls">
    <div class="controls-content">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input
          type="text"
          id="searchInput"
          placeholder="Buscar aluno por nome, número ou posto..."
        />
      </div>

      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="todos" onclick="filtrar('todos')">
          Todos
        </button>
        <button class="filter-btn" data-filter="A" onclick="filtrar('A')">
          Turma A
        </button>
        <button class="filter-btn" data-filter="B" onclick="filtrar('B')">
          Turma B
        </button>
      </div>
    </div>
  </section>

  <!-- ========== GRID DE ALUNOS ========== -->
  <main class="main">
    <div class="cards-grid" id="cardsGrid">
      <!-- Cards gerados via JavaScript -->
    </div>

    <!-- Mensagem quando nenhum resultado -->
    <div class="no-results" id="noResults" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 15s1.5-2 4-2 4 2 4 2"/>
        <line x1="9" y1="9" x2="9.01" y2="9"/>
        <line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
      <p>Nenhum aluno encontrado.</p>
    </div>
  </main>

  <!-- ========== MODAL DE DETALHES ========== -->
  <div class="modal-overlay" id="modalOverlay" onclick="fecharModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="fecharModal()">&times;</button>
      <div class="modal-body">
        <div class="modal-photo">
          <img id="modalFoto" src="" alt="Foto do aluno" />
        </div>
        <div class="modal-info">
          <span class="modal-turma" id="modalTurma"></span>
          <h2 id="modalNome"></h2>
          <div class="modal-details">
            <div class="detail-item">
              <span class="detail-label">Número</span>
              <span class="detail-value" id="modalNumero"></span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Turma</span>
              <span class="detail-value" id="modalTurmaText"></span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Posto de Trabalho</span>
              <span class="detail-value" id="modalPosto"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <p>&copy; 2024 Carômetro &mdash; Sistema de Monitoramento de Alunos</p>
  </footer>

  <!-- Scripts -->
  <script src="js/dados.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
